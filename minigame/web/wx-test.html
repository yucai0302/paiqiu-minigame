<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>小游戏运行时模拟（wx 垫片）</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1520;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 390px;
        height: 844px;
      }
    </style>
  </head>
  <body>
    <script>
      // 用浏览器模拟小游戏运行时，验证 wx 分支与垫片顺序
      (function () {
        var realDoc = document;
        var handlers = { start: [], move: [], end: [], cancel: [] };
        var active = new Map();

        function emit(type, payload) {
          handlers[type].forEach(function (cb) {
            cb(payload);
          });
        }

        var rawCanvas = /[?&]rawcanvas=1/.test(location.search);

        // ?rawcanvas=1 模拟 PC 微信 runtime：canvas 是原生对象，没有
        // addEventListener / style / clientWidth 等 DOM 接口
        function stripDom(c) {
          if (!rawCanvas) return c;
          c.addEventListener = undefined;
          c.removeEventListener = undefined;
          c.setAttribute = undefined;
          c.getBoundingClientRect = undefined;
          c.style = undefined;
          c.clientWidth = undefined;
          c.clientHeight = undefined;
          return c;
        }

        var canvasCalls = 0;
        window.wx = {
          // 与真机一致：首次调用返回主屏画布（上屏），其后返回离屏画布
          createCanvas: function () {
            var c = realDoc.createElement('canvas');
            canvasCalls += 1;
            if (canvasCalls === 1) realDoc.body.appendChild(c);
            return stripDom(c);
          },
          createOffscreenCanvas: function (o) {
            var c = realDoc.createElement('canvas');
            c.width = (o && o.width) || 1;
            c.height = (o && o.height) || 1;
            return stripDom(c);
          },
          getWindowInfo: function () {
            return {
              windowWidth: 390,
              windowHeight: 844,
              pixelRatio: 2,
              safeArea: { top: 0, bottom: 844 },
            };
          },
          getSystemInfoSync: function () {
            return {
              windowWidth: 390,
              windowHeight: 844,
              screenWidth: 390,
              screenHeight: 844,
              pixelRatio: 2,
              safeArea: { top: 0, bottom: 844 },
            };
          },
          onTouchStart: function (cb) {
            handlers.start.push(cb);
          },
          onTouchMove: function (cb) {
            handlers.move.push(cb);
          },
          onTouchEnd: function (cb) {
            handlers.end.push(cb);
          },
          onTouchCancel: function (cb) {
            handlers.cancel.push(cb);
          },
          createWebAudioContext: function () {
            return null;
          },
          vibrateShort: function () {},
        };

        // ?legacywx=1 模拟旧基础库 / PC 微信 runtime：无 createOffscreenCanvas、无 getWindowInfo
        if (/[?&]legacywx=1/.test(location.search)) {
          delete window.wx.createOffscreenCanvas;
          delete window.wx.getWindowInfo;
        }

        // ?safefx=1 开启安全渲染模式（纯色地板、关光束、隐藏名牌/号码）
        if (/[?&]safefx=1/.test(location.search)) {
          window.__SAFEFX__ = 1;
        }

        window.__touch = function (type, id, x, y) {
          var t = { identifier: id, clientX: x, clientY: y };
          if (type === 'start') {
            active.set(id, t);
            emit('start', { changedTouches: [t], touches: Array.from(active.values()) });
          } else if (type === 'move') {
            active.set(id, t);
            emit('move', { changedTouches: [t], touches: Array.from(active.values()) });
          } else if (type === 'end') {
            active.delete(id);
            emit('end', { changedTouches: [t], touches: Array.from(active.values()) });
          }
        };
      })();
    </script>
    <script src="../js/main.js"></script>
  </body>
</html>
